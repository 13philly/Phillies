<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06152f">
<title>PHILLIES</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:#06152f;color:#f5f7fa;font-family:Inter,sans-serif}
.header{height:78px;border-bottom:1px solid #ffffff12}
.header-in{height:100%;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:"Barlow Condensed",sans-serif;font-size:29px;font-weight:800;letter-spacing:.5px}
.brand b{color:#e31837}
.sub{margin-top:1px;color:#718199;font:600 7px Inter;letter-spacing:2.2px}
.year{color:#718199;font-size:10px;font-weight:700;letter-spacing:1.5px}
.nav{position:fixed;z-index:5;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 24px);max-width:430px;height:66px;padding:5px;display:grid;grid-template-columns:repeat(3,1fr);background:#091a36f5;border:1px solid #ffffff18;border-radius:18px;backdrop-filter:blur(18px)}
.nav button{position:relative;border:0;background:none;color:#718199;border-radius:13px;font:600 8px Inter;letter-spacing:1.2px}
.nav button.active{color:#fff;background:#ffffff08}
.nav button.active:after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;background:#e31837;border-radius:50%;transform:translateX(-50%)}
.icon{height:23px;display:grid;place-items:center;margin-bottom:3px}
.home{width:18px;height:18px;position:relative;border:2px solid currentColor;border-radius:4px}
.home:before{content:"";position:absolute;width:7px;height:7px;left:3.5px;top:-5px;border-left:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}
.player{width:18px;height:18px;position:relative}
.player:before{content:"";position:absolute;left:6px;top:0;width:5px;height:5px;border:2px solid currentColor;border-radius:50%}
.player:after{content:"";position:absolute;left:2px;bottom:0;width:12px;height:7px;border:2px solid currentColor;border-bottom:0;border-radius:8px 8px 0 0}
</style>
</head>
<body>

<header class="header">
<div class="header-in">
<div>
<div class="brand"><b>P</b>HILLIES</div>
<div class="sub">PHILADELPHIA BASEBALL</div>
</div>
<div class="year">2026</div>
</div>
</header>

<nav class="nav">
<button><span class="icon">▤</span>SCHEDULE</button>
<button class="active"><span class="icon"><i class="home"></i></span>HOME</button>
<button><span class="icon"><i class="player"></i></span>PLAYERS</button>
</nav>

</body>
</html>
