<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162f">
<title>PHI</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:#07162f;color:#f7f9fc;font-family:Arial,sans-serif}
.header{height:68px;border-bottom:1px solid #ffffff1a}
.header-in{height:100%;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border:2px solid #e31837;border-radius:50%;display:grid;place-items:center;color:#e31837;font-size:20px;font-weight:900}
.name{font-size:21px;font-weight:900;letter-spacing:.5px}
.sub{margin-top:2px;color:#8d9bb0;font-size:7px;font-weight:700;letter-spacing:1.5px}
.year{color:#8d9bb0;font-size:10px;font-weight:800;letter-spacing:1px}
.nav{position:fixed;z-index:5;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 24px);max-width:430px;height:64px;padding:4px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #ffffff1f;border-radius:16px;background:#07162ff7;backdrop-filter:blur(16px)}
.nav button{position:relative;border:0;background:0;color:#8d9bb0;border-radius:12px;font:inherit}
.nav button.active{color:#f7f9fc;background:#ffffff0d}
.nav button.active:before{content:"";position:absolute;top:5px;left:50%;width:18px;height:2px;transform:translateX(-50%);border-radius:2px;background:#e31837}
.icon{display:block;font-size:17px;font-weight:800}
.label{display:block;margin-top:3px;font-size:8px;font-weight:800;letter-spacing:1px}
</style>
</head>
<body>
<header class="header">
<div class="header-in">
<div class="logo">
<div class="mark">P</div>
<div><div class="name">PHILLIES</div><div class="sub">PHILADELPHIA BASEBALL</div></div>
</div>
<div class="year">2026</div>
</div>
</header>

<nav class="nav">
<button data-page="schedule"><span class="icon">▤</span><span class="label">SCHEDULE</span></button>
<button class="active" data-page="home"><span class="icon">⌂</span><span class="label">HOME</span></button>
<button data-page="players"><span class="icon">#</span><span class="label">PLAYERS</span></button>
</nav>

<script>
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
});
</script>
</body>
</html>
